[theme]
base = "light"
primaryColor = "#1F5FAD"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F5F8"
textColor = "#18212F"
borderColor = "#DCE1E8"
showWidgetBorder = true
baseRadius = "0.375rem"
font = "sans-serif"
baseFontSize = 15
headingFontSizes = ["1.6rem", "1.25rem", "1.05rem", "0.95rem"]
headingFontWeights = [650, 600, 600, 600]
metricValueFontSize = "1.55rem"
metricValueFontWeight = 600

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[browser]
gatherUsageStats = false
